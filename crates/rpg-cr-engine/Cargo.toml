[package]
name = "rpg-cr-engine"
version = "0.1.0"
edition = "2021"
description = "Cœur déterministe RPG-CR : fiche, ouverture Acte I, épreuves, récit"

[dependencies]
axum = { version = "0.8", features = ["json"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
