# Production VPS — Nginx reverse proxy (chemin /rpg-cr), écoute locale uniquement.
# Usage : docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: .
      target: api
    # Réseau hôte : accès direct à 127.0.0.1:1234 (tunnel SSH, loopback uniquement).
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-4010}
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/rpg-cr.db
      - AVATARS_DIR=/data/avatars
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://127.0.0.1:1234/v1}
      - AUTH_INTERNAL_SECRET=${AUTH_INTERNAL_SECRET:-}
    volumes:
      - rpg-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||4010)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/rpg-cr}
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/rpg-cr}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_URL=${AUTH_URL:-https://vps-e09ed6db.vps.ovh.net/rpg-cr}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AUTH_INTERNAL_SECRET=${AUTH_INTERNAL_SECRET:-}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://127.0.0.1:4010}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const bp=(process.env.NEXT_PUBLIC_BASE_PATH||'').replace(/\\/$/,'');fetch('http://127.0.0.1:3000'+bp+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  rpg-data:
