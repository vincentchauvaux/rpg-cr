# Production VPS — Nginx reverse proxy (chemin /rpg-cr), écoute locale uniquement.
# Usage : docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-4010}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/rpg-cr.db
      - AVATARS_DIR=/data/avatars
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    volumes:
      - rpg-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/rpg-cr}
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  rpg-data:
